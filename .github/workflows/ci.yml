name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20', '22']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: CLI smoke test (stdio)
        run: |
          node dist/cli.js lock --name fixture -- node test/fixtures/server.mjs
          node dist/cli.js verify --name fixture -- node test/fixtures/server.mjs
          FIXTURE_VARIANT=poisoned node dist/cli.js verify --name fixture -- node test/fixtures/server.mjs && exit 1 || test $? -eq 1
      - name: CLI smoke test (streamable http)
        run: node test/fixtures/smoke-http.mjs
